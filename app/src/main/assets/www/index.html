<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vistoria Arbórea</title>
<style>
/* Layout: uma coluna para uso em campo, barra superior fixa, ações grandes para o polegar */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#15211c; --muted:#5b6b64; --line:#d5ddd9;
  --brand:#1f4e79; --brand-ink:#ffffff; --leaf:#2e6b4f; --soft:#e6eef5;
  --low:#d9eed8; --mod:#fff0c2; --high:#f7c7a8; --ext:#d9534f; --ext-ink:#fff;
  --r:10px;
  --f:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1513; --surface:#18211e; --ink:#e7eeeb; --muted:#9aaba4; --line:#2c3a35;
  --brand:#6fa3d4; --brand-ink:#0b1622; --leaf:#7fc3a0; --soft:#1d2b36;
  --low:#21402b; --mod:#4a4018; --high:#5a3220; --ext:#c94541; --ext-ink:#fff; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f)}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);
  padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;display:flex;align-items:center;gap:8px}
header h1{font-size:17px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{font-size:12px;opacity:.85;font-weight:400;display:block}
.iconbtn{background:transparent;border:0;color:inherit;width:40px;height:40px;border-radius:50%;font-size:22px;line-height:1}
.iconbtn:active{background:rgba(255,255,255,.15)}
main{padding:12px 12px 24px;max-width:760px;margin:0 auto}
.tabs{display:flex;gap:4px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:calc(60px + env(safe-area-inset-top,0px));z-index:4;overflow-x:auto}
.tabs button{flex:1;border:0;background:none;padding:12px 6px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--brand);border-bottom-color:var(--brand)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.card h2{font-size:15px;margin:0 0 8px;color:var(--brand);text-transform:uppercase;letter-spacing:.04em}
.listitem{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px}
.listitem .t{font-weight:600}
.listitem .m{color:var(--muted);font-size:13px}
.listitem .grow{flex:1;min-width:0}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.row{display:flex;gap:6px;align-items:flex-start}
.row>.grow{flex:1;min-width:0}
input[type=text],input[type=date],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:0}
.mic{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--leaf);color:#fff;font-size:20px}
.mic.on{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none;outline:3px solid var(--ext)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:6px 10px;font-size:13px;text-align:left}
.chip:active{background:var(--brand);color:var(--brand-ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{border:0;border-radius:8px;padding:12px 14px;font-weight:600;background:var(--brand);color:var(--brand-ink)}
.btn.sec{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--ext);border:1px solid var(--ext)}
.btn.block{width:100%}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;border-radius:999px;padding:14px 20px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:6px}
.ph{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.ph img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.ph input{border:0;border-top:1px solid var(--line);border-radius:0;padding:6px;font-size:12px}
.ph .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff}
.addph{display:flex;gap:6px;margin-top:6px}
.addph .btn{flex:1;padding:10px;font-size:14px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.r-Baixo{background:var(--low)} .r-Moderado{background:var(--mod)} .r-Alto{background:var(--high)} .r-Extremo{background:var(--ext);color:var(--ext-ink)}
.riskline{border:1px dashed var(--line);border-radius:8px;padding:10px;margin-bottom:8px}
.hint{font-size:12px;color:var(--muted)}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px}
details.sec>summary{list-style:none;padding:14px 12px;font-weight:700;display:flex;align-items:center;gap:8px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"▾";margin-left:auto;color:var(--muted)}
details.sec[open]>summary::after{content:"▴"}
details.sec>.in{padding:0 12px 12px}
.badge{font-size:11px;color:var(--muted);font-weight:500}
.done{color:var(--leaf)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20;max-width:90vw;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.calc{font-size:13px;margin-top:6px}
.dap{font-size:13px;color:var(--muted);margin-top:4px}
</style>
</head>
<body>
<div id="app"></div>
<script src="jszip.min.js"></script>
<script src="docx.js"></script>
<script>
"use strict";
/* ============ PONTE NATIVA (Android) com simulação para navegador ============ */
const NATIVE = typeof window.Android !== "undefined";
const mockPhotos = {};
const Bridge = NATIVE ? window.Android : {
  loadDb(){ try{return localStorage.getItem("vistoria_db")||""}catch(e){return ""} },
  saveDb(j){ try{localStorage.setItem("vistoria_db",j);return true}catch(e){return false} },
  photoBase(){ return "" },
  readPhoto(n){ return (mockPhotos[n]||"").split(",")[1]||"" },
  deletePhoto(n){ delete mockPhotos[n] },
  startSpeech(id){ setTimeout(()=>window.__speechError(id,"Ditado por voz disponível apenas no app Android."),50) },
  takePhoto(id){ pickFile(id) }, pickPhoto(id){ pickFile(id) },
  saveExport(name,b64,mime){ const a=document.createElement("a"); a.href="data:"+mime+";base64,"+b64; a.download=name; document.body.appendChild(a); a.click(); a.remove(); window.__lastExport={name,b64}; return "mock://"+name },
  share(){}, openFile(){}
};
function pickFile(id){
  const i=document.createElement("input"); i.type="file"; i.accept="image/*";
  i.onchange=()=>{ const f=i.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ const img=new Image(); img.onload=()=>{ const s=Math.min(1,1600/Math.max(img.width,img.height));
      const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); const name="p"+Date.now()+".jpg";
      mockPhotos[name]=c.toDataURL("image/jpeg",.85); window.__photo(id,name)}; img.src=r.result }; r.readAsDataURL(f) };
  i.click();
}
function photoSrc(name){ return NATIVE ? Bridge.photoBase()+name : (mockPhotos[name]||"") }

/* ============ DADOS ============ */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
let DB={vistorias:[]};
try{ const raw=Bridge.loadDb(); if(raw) DB=JSON.parse(raw) }catch(e){}
if(!DB.vistorias) DB={vistorias:[]};
if(!DB.perfil) DB.perfil={equipe:"",responsavel:"",assinatura:""};
let saveTimer=null;
function save(now){ clearTimeout(saveTimer); const run=()=>{ const ok=Bridge.saveDb(JSON.stringify(DB)); if(!ok) toast("Não foi possível salvar. Verifique o espaço do aparelho.") }; if(now) run(); else saveTimer=setTimeout(run,500) }
function touch(v){ v.atualizado=new Date().toISOString(); save() }
const hoje=()=>new Date().toISOString().slice(0,10);

const OBJETIVO_PADRAO="Avaliação fitossanitária e de risco de queda de indivíduo(s) arbóreo(s), visando subsidiar tecnicamente a decisão de manejo e a instrução do respectivo requerimento perante o órgão ambiental competente.";
function novaVistoria(){
  return {id:uid(),criado:new Date().toISOString(),atualizado:new Date().toISOString(),
    solicitante:"",documento:"",endereco:"",municipio:"",uf:"PR",cep:"",data:hoje(),
    equipe:DB.perfil.equipe||"",responsavel:DB.perfil.responsavel||"",art:"",objetivo:OBJETIVO_PADRAO,
    caracterizacao:"",parecer:"",arvores:[]};
}
function novaArvore(v){
  const n=v.arvores.length+1; const ant=v.arvores[v.arvores.length-1]||{};
  return {id:uid(),num:n,especie:ant.especie||"",popular:ant.popular||"",origem:ant.origem||"Nativa",ameacada:ant.ameacada||"Não",
    cap:"",altura:"",lat:"",lon:"",copa:"",tronco:"",raizes:"",entorno:"",alvos:"",probAtingir:"",consequencias:"",
    riscos:[{id:uid(),parte:"Árvore inteira",alvo:"",pf:"",pi:"",cons:""}],classificacaoTxt:"",alternativas:"",recomendacao:"",
    estadoGeral:"",recResumo:"",fotos:[]};
}

/* ============ METODOLOGIA ISA ============ */
const PF=["Improvável","Possível","Provável","Iminente"];
const PI=["Muito baixa","Baixa","Média","Alta"];
const CONS=["Insignificante","Menor","Significativa","Severa"];
const M1=[ /* linhas = PF (improvável..iminente), colunas = PI (muito baixa..alta) */
 ["Improvável","Improvável","Improvável","Improvável"],
 ["Improvável","Improvável","Improvável","Pouco provável"],
 ["Improvável","Improvável","Pouco provável","Provável"],
 ["Improvável","Pouco provável","Provável","Muito provável"]];
const M1L=["Improvável","Pouco provável","Provável","Muito provável"];
const M2={ "Muito provável":["Baixo","Moderado","Alto","Extremo"], "Provável":["Baixo","Moderado","Alto","Alto"],
  "Pouco provável":["Baixo","Baixo","Moderado","Moderado"], "Improvável":["Baixo","Baixo","Baixo","Baixo"] };
const RISK_ORDER=["Baixo","Moderado","Alto","Extremo"];
function calcLinha(l){
  const a=PF.indexOf(l.pf), b=PI.indexOf(l.pi), c=CONS.indexOf(l.cons);
  if(a<0||b<0) return {comb:null,risco:null};
  const comb=M1[a][b]; if(c<0) return {comb,risco:null};
  return {comb,risco:M2[comb][c]};
}
function calcArvore(t){
  let best=null, iminente=false;
  for(const l of t.riscos||[]){ const r=calcLinha(l); if(l.pf==="Iminente") iminente=true;
    if(r.risco && (best===null || RISK_ORDER.indexOf(r.risco)>RISK_ORDER.indexOf(best))) best=r.risco; }
  return {risco:best, iminente};
}
function riscoResumo(t){ const c=calcArvore(t); if(!c.risco) return ""; return c.risco+(c.iminente&&c.risco==="Extremo"?" / iminente":""); }
function riscoTexto(t){
  if((t.classificacaoTxt||"").trim()) return t.classificacaoTxt.trim();
  const c=calcArvore(t); if(!c.risco) return "";
  return c.risco==="Extremo"&&c.iminente ? "Risco extremo ou iminente." : "Risco "+c.risco.toLowerCase()+".";
}
const dap=cap=>{ const n=parseFloat(String(cap).replace(",",".")); return isFinite(n)&&n>0 ? (n/Math.PI) : null };
const fmt1=n=>n==null?"":n.toFixed(1).replace(".",",");

/* ============ FRASES RÁPIDAS (da ficha de campo / laudo modelo) ============ */
const CHIPS={
  copa:["Copa com vigor normal","Vigor reduzido","Ausência de copa","100% dos galhos quebrados","Galhos mortos em parte da copa","Galhos pendurados ou soltos","Copa desequilibrada","Clorose / necrose foliar","Indivíduo sem capacidade funcional aparente"],
  tronco:["Presença de corpos de frutificação fúngicos na base e ao longo do tronco, indicando processo de apodrecimento","Perfurações visíveis, provavelmente associadas à ação de insetos xilófagos","Som oco à percussão, indicativo de perda de lenho interno","Som maciço à percussão","Cavidade / oco aberto","Rachaduras ou fissuras","Desprendimento visível de lenho","Desprendimento intenso de casca","Inclinação acentuada não corrigida","Dano mecânico no tronco","Sem defeitos aparentes no tronco"],
  raizes:["Raízes não visíveis superficialmente","Base envolvida por concreto, com área muito reduzida para infiltração de água e trocas gasosas no solo","Base parcialmente envolvida por concreto","Base completamente envolvida por concreto, sem área de infiltração","Raízes cortadas ou danificadas","Levantamento ou rachadura do piso","Corpos de frutificação fúngicos no colo","Sem alterações aparentes na base e raízes"],
  entorno:["Indivíduo localizado a menos de 1 m de estrutura de alvenaria","Presença de trânsito frequente de pessoas a menos de 2 m do tronco","Presença de edificações no entorno","Proximidade da rede elétrica","Proximidade de via pública ou calçada","Área de estacionamento de veículos"],
  alvos:["Pessoas","Telhado","Estruturas de alvenaria","Veículos","Rede elétrica","Via pública","Demais elementos construídos no entorno imediato"],
  probAtingir:["Muito baixa","Baixa","Média","Alta","Muito alta"],
  consequencias:["As consequências potenciais da falha são severas, envolvendo danos estruturais a construções e risco direto à vida.","As consequências potenciais da falha são significativas, com possibilidade de danos a estruturas e lesões a pessoas.","As consequências potenciais da falha são menores, restritas a danos de pequena monta.","As consequências potenciais da falha são insignificantes."],
  alternativas:["Não há alternativa de manejo conservativo tecnicamente recomendada para este indivíduo, considerando que a árvore se encontra morta, com sinais de apodrecimento e perda estrutural interna.","Poda de limpeza com remoção de galhos mortos","Poda de redução de copa","Monitoramento periódico","Restrição de acesso à área de queda"],
  recomendacao:["Supressão do indivíduo arbóreo.","Isolar a área até o manejo por equipe habilitada e o protocolo junto ao órgão ambiental competente.","Manutenção do indivíduo com monitoramento periódico.","Poda de limpeza e remoção de galhos mortos."],
  estadoGeral:["Morta, sem copa, com sinais de apodrecimento e cavidades internas","Viva, com vigor reduzido","Viva, em bom estado fitossanitário","Em declínio"],
  recResumo:["Supressão e isolamento imediato da área","Supressão","Poda","Manutenção com monitoramento"],
  caracterizacao:["Segundo relatos dos moradores, já ocorreram quedas de galhos provenientes dessas árvores, com danos ao telhado das edificações próximas.","Há circulação recorrente de pessoas na área.","Os indivíduos avaliados encontram-se no entorno imediato das edificações existentes no terreno."],
};
const FOTO_SECOES=[["copa","Copa"],["tronco","Tronco"],["raizes","Raízes / infiltração"],["entorno","Área de entorno"]];

/* ============ ROTEAMENTO ============ */
let route={view:"home"}; // home | vistoria(id,tab) | arvore(id,aid)
const findV=id=>DB.vistorias.find(v=>v.id===id);
function go(r){ route=r; render(); window.scrollTo(0,0) }
window.__back=function(){
  if(route.view==="arvore"){ go({view:"vistoria",id:route.id,tab:"arvores"}); return true }
  if(route.view==="vistoria"||route.view==="perfil"){ go({view:"home"}); return true }
  return false;
};

/* ============ UTILIDADES DE UI ============ */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let toastT; function toast(msg){ let t=document.querySelector(".toast"); if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)} t.textContent=msg; clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),3200) }
let fieldCtx={}; // id do campo -> {obj, key, onChange}
function bindObj(obj,key,onChange){ const id="f_"+uid(); fieldCtx[id]={obj,key,onChange}; return id }
function textField(label,obj,key,opts={}){
  const id=bindObj(obj,key,opts.onChange); const chips=opts.chips||CHIPS[key];
  const area = opts.single
    ? `<input type="text" id="${id}" data-bind value="${esc(obj[key])}" ${opts.ph?`placeholder="${esc(opts.ph)}"`:""}>`
    : `<textarea id="${id}" data-bind ${opts.ph?`placeholder="${esc(opts.ph)}"`:""}>${esc(obj[key])}</textarea>`;
  return `<div class="field"><label for="${id}">${esc(label)}</label>
   <div class="row"><div class="grow">${area}</div>${opts.nomic?"":`<button class="mic" data-mic="${id}" aria-label="Ditar ${esc(label)}">🎤</button>`}</div>
   ${chips&&!opts.nochips?`<div class="chips">${chips.map(c=>`<button class="chip" data-chip="${id}" data-mode="${opts.chipMode||"append"}">${esc(c)}</button>`).join("")}</div>`:""}
   ${opts.hint?`<div class="hint">${esc(opts.hint)}</div>`:""}</div>`;
}
function inputField(label,obj,key,type="text",opts={}){
  const id=bindObj(obj,key,opts.onChange);
  return `<div class="field"><label for="${id}">${esc(label)}</label><input type="${type==="number"?"text":type}" id="${id}" data-bind value="${esc(obj[key])}" ${type==="number"?'inputmode="decimal"':""} ${opts.ph?`placeholder="${esc(opts.ph)}"`:""}>${opts.after||""}</div>`;
}
function selectField(label,obj,key,options,opts={}){
  const id=bindObj(obj,key,opts.onChange);
  return `<div class="field"><label for="${id}">${esc(label)}</label><select id="${id}" data-bind><option value="">—</option>${options.map(o=>`<option ${obj[key]===o?"selected":""}>${esc(o)}</option>`).join("")}</select></div>`;
}
function appendText(cur,add,mode){
  if(mode==="replace") return add;
  cur=(cur||"").trim(); if(!cur) return add;
  if(/[.;:]$/.test(cur)) return cur+" "+add;
  return cur+"; "+add.charAt(0).toLowerCase()+add.slice(1);
}
function setField(id,val){ const c=fieldCtx[id]; if(!c) return; c.obj[c.key]=val; const el=document.getElementById(id); if(el){ el.value=val; grow(el) } afterChange(c) }
function afterChange(c){ const v=currentV(); if(v) touch(v); else save(); if(c&&c.onChange) c.onChange() }
const currentV=()=>route.id?findV(route.id):null;

/* ============ TELAS ============ */
function render(){
  fieldCtx={};
  const app=document.getElementById("app");
  if(route.view==="home") app.innerHTML=viewHome();
  else if(route.view==="perfil") app.innerHTML=viewPerfil();
  else if(route.view==="vistoria"){ const v=currentV(); if(!v) return go({view:"home"}); app.innerHTML=viewVistoria(v) }
  else if(route.view==="arvore"){ const v=currentV(); const t=v&&v.arvores.find(a=>a.id===route.aid); if(!t) return go({view:"home"}); app.innerHTML=viewArvore(v,t) }
  requestAnimationFrame(()=>document.querySelectorAll("textarea").forEach(grow));
  document.querySelectorAll("details.sec").forEach(d=>d.addEventListener("toggle",()=>d.querySelectorAll("textarea").forEach(grow)));
}
function header(title,sub,back){
  return `<header>${back?`<button class="iconbtn" data-act="back" aria-label="Voltar">←</button>`:""}<h1>${esc(title)}${sub?`<span class="sub">${esc(sub)}</span>`:""}</h1>${route.view==="home"?`<button class="iconbtn" data-act="perfil" aria-label="Equipe padrão">⚙</button>`:""}</header>`;
}
function viewHome(){
  const list=[...DB.vistorias].sort((a,b)=>b.atualizado.localeCompare(a.atualizado));
  return header("Vistoria Arbórea","Avaliação fitossanitária e de risco") + `<main>
  ${list.length?list.map(v=>`<button class="listitem" data-act="openV" data-id="${v.id}"><div class="grow"><div class="t">${esc(v.endereco||"Vistoria sem endereço")}</div>
   <div class="m">${esc(v.municipio||"")}${v.municipio?" · ":""}${fmtData(v.data)} · ${v.arvores.length} árvore(s)${v.solicitante?" · "+esc(v.solicitante):""}</div></div><span aria-hidden="true">›</span></button>`).join("")
   :`<div class="empty"><p><b>Nenhuma vistoria ainda.</b></p><p>Toque em “Nova vistoria” para começar. Tudo fica salvo no aparelho, sem precisar de internet.</p></div>`}
  </main><button class="btn fab" data-act="newV">+ Nova vistoria</button>`;
}
function viewPerfil(){
  return header("Equipe padrão","Preenchida automaticamente em novas vistorias",true)+`<main><div class="card">
  ${textField("Equipe técnica (uma pessoa por linha)",DB.perfil,"equipe",{nochips:true,ph:"Nome / formação, registro"})}
  ${textField("Responsável técnico (assinatura do laudo)",DB.perfil,"responsavel",{nochips:true,ph:"Nome\nRegistro profissional"})}
  </div></main>`;
}
function fmtData(d){ if(!d) return ""; const [y,m,dd]=d.split("-"); return `${dd}/${m}/${y}` }
function viewVistoria(v){
  const tab=route.tab||"geral";
  const tabs=[["geral","Dados gerais"],["arvores",`Árvores (${v.arvores.length})`],["laudo","Laudo"],["exportar","Exportar"]];
  let body="";
  if(tab==="geral") body=`<div class="card"><h2>Identificação</h2>
    ${textField("Solicitante",v,"solicitante",{single:true})}
    ${textField("CPF / RG / CNPJ do solicitante",v,"documento",{single:true,nomic:true})}
    ${textField("Endereço da vistoria",v,"endereco",{single:true,ph:"Rua, nº"})}
    <div class="grid3"><div style="grid-column:span 2">${textField("Município",v,"municipio",{single:true})}</div>${inputField("UF",v,"uf")}</div>
    <div class="grid2">${inputField("CEP",v,"cep")}${inputField("Data da vistoria",v,"data","date")}</div>
    ${textField("Equipe técnica (uma pessoa por linha)",v,"equipe",{nochips:true,ph:"Nome / formação, registro"})}
    ${textField("Responsável técnico",v,"responsavel",{nochips:true,ph:"Nome\nRegistro profissional"})}
    ${inputField("Nº ART / RRT",v,"art")}
    ${textField("Objetivo",v,"objetivo",{nochips:true})}
   </div>
   <div class="card"><h2>Caracterização da área</h2>${textField("Uso do local, circulação de pessoas, histórico de quedas e danos",v,"caracterizacao")}</div>
   <div class="card"><h2>Excluir</h2>${confirmBlock("delV","Excluir esta vistoria","Excluir definitivamente, com fotos")}</div>`;
  else if(tab==="arvores") body=(v.arvores.length?v.arvores.map(t=>{ const r=riscoResumo(t); const rk=calcArvore(t).risco;
     return `<button class="listitem" data-act="openT" data-aid="${t.id}"><div class="grow"><div class="t">Árvore ${t.num} · <i>${esc(t.especie||"espécie não informada")}</i></div>
     <div class="m">CAP ${esc(t.cap||"–")} cm · DAP ${fmt1(dap(t.cap))||"–"} cm · ${esc(t.altura||"–")} m · ${t.fotos.length} foto(s)</div></div>${rk?`<span class="pill r-${rk}">${esc(r)}</span>`:""}</button>`}).join("")
     :`<div class="empty"><p><b>Nenhuma árvore cadastrada.</b></p><p>Toque em “Nova árvore” para avaliar o primeiro indivíduo.</p></div>`)+`<button class="btn fab" data-act="newT">+ Nova árvore</button>`;
  else if(tab==="laudo") body=`<div class="card"><h2>Parecer conclusivo</h2>${textField("Texto do parecer (vai para a seção 8 do laudo)",v,"parecer",{nochips:true})}
     <button class="btn sec block" data-act="sugParecer">Gerar sugestão a partir das árvores</button><div class="hint" style="margin-top:6px">A sugestão substitui o texto atual. Revise antes de exportar.</div></div>
     <div class="card"><h2>O que entra no laudo</h2><div class="hint">1. Identificação e objetivo · 2. Base legal, normativa e metodológica (NBR 16246-3:2025, ISA, Lei 15.299/2025 e Portaria MMA 148/2022 quando houver espécie ameaçada) · 3. Metodologia · 4. Critérios de classificação · 5. Caracterização da área · 6. Quadro-resumo · 7. Avaliação individual · 8. Parecer conclusivo · Assinatura · Anexo I – Registro fotográfico.</div></div>`;
  else body=`<div class="card"><h2>Exportar</h2><p class="hint">Os arquivos vão para a pasta <b>Download/Vistoria Arvores</b> do aparelho.</p>
     <button class="btn block" data-act="expDocx" style="margin-bottom:8px">Laudo técnico (.docx)</button>
     <button class="btn block" data-act="expXlsx" style="margin-bottom:8px">Planilha de dados (.xlsx)</button>
     <div id="expOut"></div></div>
     <div class="card"><h2>Pendências</h2>${pendencias(v)}</div>`;
  return header(v.endereco||"Nova vistoria",[v.municipio,fmtData(v.data)].filter(Boolean).join(" · "),true)+
   `<nav class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${k===tab}" data-act="tab" data-tab="${k}">${l}</button>`).join("")}</nav><main>${body}</main>`;
}
function pendencias(v){
  const p=[]; if(!v.solicitante) p.push("Solicitante"); if(!v.endereco) p.push("Endereço"); if(!v.responsavel) p.push("Responsável técnico"); if(!v.art) p.push("Nº ART");
  if(!v.arvores.length) p.push("Nenhuma árvore cadastrada");
  v.arvores.forEach(t=>{ const f=[]; if(!t.especie) f.push("espécie"); if(!t.cap) f.push("CAP"); if(!t.altura) f.push("altura"); if(!calcArvore(t).risco&&!t.classificacaoTxt) f.push("classificação de risco"); if(!t.recomendacao) f.push("recomendação"); if(!t.fotos.length) f.push("fotos"); if(f.length) p.push(`Árvore ${t.num}: ${f.join(", ")}`) });
  if(!v.parecer) p.push("Parecer conclusivo");
  return p.length?`<ul style="margin:0;padding-left:18px">${p.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<p class="done"><b>Tudo preenchido.</b></p>`;
}
function confirmBlock(act,label,confirmLabel){
  return `<div class="confirm" data-confirm><button class="btn danger" data-act="askConfirm">${esc(label)}</button><span hidden data-c><button class="btn danger" data-act="${act}">${esc(confirmLabel)}</button> <button class="btn sec" data-act="cancelConfirm">Cancelar</button></span></div>`;
}
function photoBlock(t,secao){
  const fs=t.fotos.filter(f=>f.secao===secao);
  return `<div class="photos">${fs.map(f=>{ const id=bindObj(f,"legenda"); return `<div class="ph"><img src="${esc(photoSrc(f.nome))}" alt="${esc(f.legenda)}"><button class="x" data-act="delPh" data-ph="${f.id}" aria-label="Remover foto">✕</button><input type="text" id="${id}" data-bind value="${esc(f.legenda)}" aria-label="Legenda"></div>`}).join("")}</div>
   <div class="addph"><button class="btn sec" data-act="cam" data-sec="${secao}">📷 Câmera</button><button class="btn sec" data-act="gal" data-sec="${secao}">🖼 Galeria</button></div>`;
}
function viewArvore(v,t){
  const dapEl=`<div class="dap" id="dapOut">DAP: ${fmt1(dap(t.cap))||"–"} cm</div>`;
  const recalc=()=>{ const o=document.getElementById("dapOut"); if(o) o.textContent="DAP: "+(fmt1(dap(t.cap))||"–")+" cm" };
  const sec=(key,title,inner,open)=>`<details class="sec" ${open?"open":""} data-sec="${key}"><summary>${title}</summary><div class="in">${inner}</div></details>`;
  const riskHtml=(t.riscos||[]).map((l,i)=>{ const r=calcLinha(l); return `<div class="riskline" data-line="${l.id}">
     <div class="grid2">${textField("Parte que pode falhar",l,"parte",{single:true,nochips:true,nomic:true})}${textField("Alvo",l,"alvo",{single:true,nochips:true,nomic:true})}</div>
     <div class="grid3">${selectField("Prob. de falha",l,"pf",PF,{onChange:updRisk})}${selectField("Prob. de impacto",l,"pi",PI,{onChange:updRisk})}${selectField("Consequência",l,"cons",CONS,{onChange:updRisk})}</div>
     <div class="calc" data-calc="${l.id}">${calcHtml(r)}</div>
     ${t.riscos.length>1?`<button class="btn sec" style="margin-top:6px" data-act="delRisk" data-line="${l.id}">Remover linha</button>`:""}</div>`}).join("");
  return header(`Árvore ${t.num}`,t.especie||v.endereco,true)+`<main>
   ${sec("id","Identificação e dendrometria",`
     ${textField("Espécie (nome científico)",t,"especie",{single:true,nochips:true,onChange:()=>{}})}
     ${textField("Nome popular",t,"popular",{single:true,nochips:true})}
     <div class="grid2">${selectField("Origem",t,"origem",["Nativa","Exótica"])}${selectField("Ameaçada (MMA 148/2022)",t,"ameacada",["Não","VU – Vulnerável","EN – Em Perigo","CR – Criticamente em Perigo"])}</div>
     <div class="grid2">${inputField("CAP a 1,30 m (cm)",t,"cap","number",{onChange:recalc,after:dapEl})}${inputField("Altura estimada (m)",t,"altura","number")}</div>
     <div class="grid2">${inputField("Latitude",t,"lat")}${inputField("Longitude",t,"lon")}</div>`,true)}
   ${sec("copa","Estado da copa",textField("Estado da copa",t,"copa")+photoBlock(t,"copa"))}
   ${sec("tronco","Condição do tronco",textField("Condição do tronco (inclua o resultado da percussão)",t,"tronco")+photoBlock(t,"tronco"))}
   ${sec("raizes","Condição das raízes",textField("Base, colo e raízes",t,"raizes")+photoBlock(t,"raizes"))}
   ${sec("entorno","Área no entorno e alvos",textField("Área no entorno",t,"entorno")+photoBlock(t,"entorno")+textField("Alvos potenciais",t,"alvos"))}
   ${sec("risco","Avaliação de risco (ISA)",`<div class="hint" style="margin-bottom:8px">Uma linha para cada parte que pode falhar × alvo. A classificação geral é a maior entre as linhas.</div>
     <div id="riskLines">${riskHtml}</div><button class="btn sec block" data-act="addRisk">+ Linha de risco</button>
     <div class="card" style="margin-top:10px">Classificação calculada: <span id="riskTotal">${riskTotalHtml(t)}</span></div>
     ${textField("Probabilidade de atingir um alvo",t,"probAtingir",{single:true,chipMode:"replace"})}
     ${textField("Consequências potenciais da falha e severidade",t,"consequencias",{chipMode:"replace"})}
     ${textField("Classificação do risco (texto do laudo)",t,"classificacaoTxt",{single:true,nochips:true,ph:"Deixe vazio para usar o cálculo",hint:"Vazio = usa a classificação calculada."})}`)}
   ${sec("manejo","Manejo e recomendação",textField("Alternativas de manejo",t,"alternativas")+textField("Recomendação técnica",t,"recomendacao"))}
   ${sec("resumo","Resumo para o quadro do laudo",textField("Estado geral (curto)",t,"estadoGeral",{chipMode:"replace"})+textField("Recomendação (curta)",t,"recResumo",{single:true,chipMode:"replace"}))}
   ${sec("outras","Outras fotos",photoBlock(t,"geral"))}
   <div class="card">${confirmBlock("delT","Excluir árvore","Excluir árvore e fotos")}</div>
  </main>`;
}
function calcHtml(r){ return r.comb?`Falha × impacto: <b>${r.comb}</b>${r.risco?` → Risco <span class="pill r-${r.risco}">${r.risco}</span>`:" · escolha a consequência"}`:`<span class="hint">Escolha a probabilidade de falha e de impacto.</span>` }
function riskTotalHtml(t){ const c=calcArvore(t); return c.risco?`<span class="pill r-${c.risco}">${esc(riscoResumo(t))}</span>`:"<span class='hint'>incompleta</span>" }
function updRisk(){ const v=currentV(); const t=v&&v.arvores.find(a=>a.id===route.aid); if(!t) return;
  t.riscos.forEach(l=>{ const el=document.querySelector(`[data-calc="${l.id}"]`); if(el) el.innerHTML=calcHtml(calcLinha(l)) });
  const tt=document.getElementById("riskTotal"); if(tt) tt.innerHTML=riskTotalHtml(t) }

/* ============ EVENTOS ============ */
function grow(el){ if(el&&el.tagName==="TEXTAREA"){ el.style.height="auto"; el.style.height=Math.max(76,el.scrollHeight+2)+"px" } }
document.addEventListener("input",e=>{ grow(e.target); const id=e.target.id; const c=fieldCtx[id]; if(!c||!e.target.hasAttribute("data-bind")) return; c.obj[c.key]=e.target.value; afterChange(c) });
document.addEventListener("change",e=>{ const id=e.target.id; const c=fieldCtx[id]; if(!c||e.target.tagName!=="SELECT") return; c.obj[c.key]=e.target.value; afterChange(c) });
let speechTarget=null;
window.__speech=function(reqId,text){ document.querySelectorAll(".mic.on").forEach(m=>m.classList.remove("on")); const c=fieldCtx[reqId]; if(!c||!text) return;
  const el=document.getElementById(reqId); const single=el&&el.tagName==="INPUT";
  let cur=(c.obj[c.key]||"").trim(); text=text.trim(); if(!single||cur) text=text.charAt(0).toUpperCase()+text.slice(1);
  const nv=cur?(cur+(/[.;:,]$/.test(cur)?" ":". ")+text):text; setField(reqId,nv) };
window.__speechError=function(reqId,msg){ document.querySelectorAll(".mic.on").forEach(m=>m.classList.remove("on")); if(msg) toast(msg) };
let photoReq=null;
window.__photo=function(reqId,name){ if(!photoReq||photoReq.id!==reqId) return; const {v,t,secao}=photoReq; photoReq=null;
  const n=t.fotos.filter(f=>f.secao===secao).length+1; const nomeSec=(FOTO_SECOES.find(s=>s[0]===secao)||[0,"Registro"])[1];
  t.fotos.push({id:uid(),nome:name,secao,legenda:nomeSec+(n>1?" "+n:"")}); touch(v); save(true);
  const openSecs=[...document.querySelectorAll("details.sec[open]")].map(d=>d.dataset.sec); const y=window.scrollY; render();
  openSecs.forEach(s=>{ const d=document.querySelector(`details.sec[data-sec="${s}"]`); if(d) d.open=true }); window.scrollTo(0,y); toast("Foto adicionada") };
window.__photoError=function(reqId,msg){ photoReq=null; if(msg) toast(msg) };

document.addEventListener("click",e=>{
  const chip=e.target.closest("[data-chip]"); if(chip){ const id=chip.dataset.chip; const c=fieldCtx[id]; if(c) setField(id,appendText(c.obj[c.key],chip.textContent,chip.dataset.mode)); return }
  const mic=e.target.closest("[data-mic]"); if(mic){ mic.classList.add("on"); try{ Bridge.startSpeech(mic.dataset.mic) }catch(err){ mic.classList.remove("on"); toast("Ditado indisponível neste aparelho.") } return }
  const b=e.target.closest("[data-act]"); if(!b) return; const act=b.dataset.act; const v=currentV();
  const t=v&&route.aid?v.arvores.find(a=>a.id===route.aid):null;
  switch(act){
    case "back": window.__back(); break;
    case "perfil": go({view:"perfil"}); break;
    case "newV": { const nv=novaVistoria(); DB.vistorias.push(nv); save(true); go({view:"vistoria",id:nv.id,tab:"geral"}); break }
    case "openV": go({view:"vistoria",id:b.dataset.id,tab:"geral"}); break;
    case "tab": go({view:"vistoria",id:route.id,tab:b.dataset.tab}); break;
    case "newT": { const nt=novaArvore(v); v.arvores.push(nt); touch(v); save(true); go({view:"arvore",id:v.id,aid:nt.id}); break }
    case "openT": go({view:"arvore",id:v.id,aid:b.dataset.aid}); break;
    case "askConfirm": { const w=b.closest("[data-confirm]"); b.hidden=true; w.querySelector("[data-c]").hidden=false; break }
    case "cancelConfirm": { const w=b.closest("[data-confirm]"); w.querySelector("[data-c]").hidden=true; w.querySelector("[data-act=askConfirm]").hidden=false; break }
    case "delV": { v.arvores.forEach(a=>a.fotos.forEach(f=>{try{Bridge.deletePhoto(f.nome)}catch(_){}})); DB.vistorias=DB.vistorias.filter(x=>x.id!==v.id); save(true); go({view:"home"}); toast("Vistoria excluída"); break }
    case "delT": { t.fotos.forEach(f=>{try{Bridge.deletePhoto(f.nome)}catch(_){}}); v.arvores=v.arvores.filter(a=>a.id!==t.id); v.arvores.forEach((a,i)=>a.num=i+1); touch(v); save(true); go({view:"vistoria",id:v.id,tab:"arvores"}); break }
    case "cam": case "gal": { const rid="ph_"+uid(); photoReq={id:rid,v,t,secao:b.dataset.sec}; try{ act==="cam"?Bridge.takePhoto(rid):Bridge.pickPhoto(rid) }catch(err){ photoReq=null; toast("Não foi possível abrir a câmera.") } break }
    case "delPh": { const f=t.fotos.find(x=>x.id===b.dataset.ph); if(f){ try{Bridge.deletePhoto(f.nome)}catch(_){} t.fotos=t.fotos.filter(x=>x!==f); touch(v); b.closest(".ph").remove(); toast("Foto removida") } break }
    case "addRisk": { t.riscos.push({id:uid(),parte:"",alvo:"",pf:"",pi:"",cons:""}); touch(v); const y=window.scrollY; render(); const d=document.querySelector('details.sec[data-sec="risco"]'); if(d) d.open=true; window.scrollTo(0,y); break }
    case "delRisk": { t.riscos=t.riscos.filter(l=>l.id!==b.dataset.line); touch(v); const y=window.scrollY; render(); const d=document.querySelector('details.sec[data-sec="risco"]'); if(d) d.open=true; window.scrollTo(0,y); break }
    case "sugParecer": { v.parecer=sugestaoParecer(v); touch(v); render(); toast("Sugestão inserida. Revise o texto."); break }
    case "expDocx": exportar(v,"docx",b); break;
    case "expXlsx": exportar(v,"xlsx",b); break;
    case "share": try{ Bridge.share(b.dataset.uri,b.dataset.mime) }catch(_){} break;
    case "openFile": try{ Bridge.openFile(b.dataset.uri,b.dataset.mime) }catch(_){} break;
  }
});

/* ============ TEXTOS DO LAUDO ============ */
function listaPt(a){ a=a.filter(Boolean); if(a.length<=1) return a.join(""); return a.slice(0,-1).join(", ")+" e "+a[a.length-1] }
function especies(v){ return [...new Set(v.arvores.map(t=>(t.especie||"").trim()).filter(Boolean))] }
function sugestaoParecer(v){
  const n=v.arvores.length; const esp=especies(v);
  const sup=v.arvores.filter(t=>/supress/i.test(t.recomendacao+" "+t.recResumo)).length;
  const maxR=v.arvores.map(t=>calcArvore(t).risco).filter(Boolean).sort((a,b)=>RISK_ORDER.indexOf(b)-RISK_ORDER.indexOf(a))[0];
  let s=`Com base no levantamento fitossanitário e na avaliação realizada em campo, conclui-se que ${n===1?"o indivíduo avaliado":`os ${n} indivíduos avaliados`}${esp.length?` de ${listaPt(esp)}`:""} ${n===1?"apresenta":"apresentam"} as condições descritas na Seção 7, com classificação de risco ${maxR?("até "+maxR.toLowerCase()):"a definir"}.`;
  if(sup) s+=`\n\nConsiderando a proximidade com alvos, a circulação de pessoas e a possibilidade de danos à vida e ao patrimônio, recomenda-se a supressão de ${sup===n?(n===1?"o indivíduo":"todos os indivíduos"):`${sup} indivíduo(s)`}, com isolamento da área até a execução do manejo por equipe habilitada.`;
  const am=v.arvores.filter(t=>t.ameacada&&t.ameacada!=="Não");
  if(am.length) s+=`\n\nRessalta-se que ${listaPt([...new Set(am.map(t=>t.especie))])} ${am.length>1?"constam":"consta"} na Lista Nacional Oficial de Espécies da Flora Brasileira Ameaçadas de Extinção (Portaria MMA nº 148/2022). Dessa forma, a supressão deverá ser previamente submetida à apreciação do órgão ambiental competente, com a observância dos procedimentos, autorizações e demais exigências legais aplicáveis.`;
  return s;
}

function objetivoTexto(v){

  return await z.generateAsync({type:"base64",compression:"DEFLATE"});
}

/* ============ EXPORTAÇÃO ============ */
function nomeArquivo(v,ext){ const base=(v.endereco||"vistoria").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\w]+/g,"_").replace(/^_|_$/g,"").slice(0,40); return `${ext==="docx"?"Laudo":"Dados"}_${base}_${v.data||hoje()}.${ext}` }
async function exportar(v,ext,btn){
  const out=document.getElementById("expOut"); const label=btn.textContent; btn.disabled=true; btn.textContent="Gerando…";
  try{
    save(true);
    const b64=ext==="docx"?await gerarDocx(v):await gerarXlsx(v);
    const mime=ext==="docx"?"application/vnd.openxmlformats-officedocument.wordprocessingml.document":"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
    const name=nomeArquivo(v,ext); const uri=Bridge.saveExport(name,b64,mime);
    if(!uri||String(uri).startsWith("ERR")) throw new Error(String(uri||"").replace(/^ERR:?/,"")||"falha ao gravar");
    out.innerHTML=`<div class="card" style="margin-top:8px"><b>Salvo:</b> Download/Vistoria Arvores/${esc(name)}<div class="addph"><button class="btn sec" data-act="openFile" data-uri="${esc(uri)}" data-mime="${mime}">Abrir</button><button class="btn sec" data-act="share" data-uri="${esc(uri)}" data-mime="${mime}">Compartilhar</button></div></div>`;
    toast("Arquivo salvo em Download/Vistoria Arvores");
  }catch(err){ console.error(err); toast("Não foi possível exportar: "+(err&&err.message||err)) }
  finally{ btn.disabled=false; btn.textContent=label }
}
window.__test={gerarDocx,gerarXlsx,DB:()=>DB,mockPhotos,calcLinha};
render();
</script>
