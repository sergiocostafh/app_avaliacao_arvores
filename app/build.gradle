plugins {
    id 'com.android.application'
}

android {
    namespace 'br.vistoria.arvores'
    compileSdk 34

    defaultConfig {
        applicationId 'br.vistoria.arvores'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'js', 'html'
    }
}
